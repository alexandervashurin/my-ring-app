name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Leiningen
      run: |
        curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein -o /usr/local/bin/lein
        chmod +x /usr/local/bin/lein
        lein version

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Cache Leiningen
      uses: actions/cache@v4
      with:
        path: ~/.lein
        key: ${{ runner.os }}-lein-${{ hashFiles('project.clj') }}
        restore-keys: |
          ${{ runner.os }}-lein-

    - name: Install dependencies
      run: lein deps

    - name: Run tests
      run: lein test

  build:
    name: Build uberjar
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Leiningen
      run: |
        curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein -o /usr/local/bin/lein
        chmod +x /usr/local/bin/lein
        lein version

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build uberjar
      run: lein uberjar

    - name: Upload uberjar artifact
      uses: actions/upload-artifact@v4
      with:
        name: uberjar
        path: target/uberjar/my-ring-app-*-standalone.jar
        retention-days: 7

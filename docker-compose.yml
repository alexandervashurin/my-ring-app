# Docker Compose для my-ring-app
# Использование: docker-compose up -d

version: '3.8'

services:
  # ==============================================================================
  # Веб-приложение
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-ring-app
    restart: unless-stopped
    
    # Порты
    ports:
      - "${APP_PORT:-3000}:3000"
    
    # Переменные окружения
    environment:
      - PORT=3000
      - ENV=${ENV:-production}
      - DB_TYPE=${DB_TYPE:-sqlite}
      
      # SMTP для email уведомлений
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_TLS=${SMTP_TLS:-true}
      - SMTP_FROM=${SMTP_FROM:-noreply@example.com}
    
    # Тома для сохранения данных
    volumes:
      - app-data:/app
      - app-logs:/app/logs
      - ./igra.db:/app/igra.db
    
    # Сеть
    networks:
      - my-ring-app-network
    
    # Зависимости
    depends_on: []
    
    # Ресурсы
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Health check (определяется в Dockerfile)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==============================================================================
  # Nginx Reverse Proxy (опционально)
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: my-ring-app-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    networks:
      - my-ring-app-network
    depends_on:
      - app
    profiles:
      - with-nginx

# ==============================================================================
# Тома
# ==============================================================================
volumes:
  app-data:
    driver: local
  app-logs:
    driver: local
  nginx-logs:
    driver: local

# ==============================================================================
# Сети
# ==============================================================================
networks:
  my-ring-app-network:
    driver: bridge

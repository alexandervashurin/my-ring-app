# Docker Compose для my-ring-app с PostgreSQL
# Использование: docker-compose up -d

version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: my-ring-app-db
    environment:
      POSTGRES_DB: my_ring_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      TZ: Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_migration.sql:/docker-entrypoint-initdb.d/01-migration.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - my-ring-app-network

  # Веб-приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-ring-app
    environment:
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: my_ring_app
      DB_USER: postgres
      DB_PASSWORD: postgres123
      PORT: 3000
      ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - my-ring-app-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  my-ring-app-network:
    driver: bridge
